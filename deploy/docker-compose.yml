# Betrieb: SyncDrive-Server hinter Caddy (TLS). Start aus diesem Ordner:
#   echo -n 'ein-langes-admin-passwort' > admin-password.txt
#   docker compose up -d            # fertiges Image von Docker Hub (SYNCDRIVE_VERSION, Standard latest)
#   docker compose up -d --build    # stattdessen aus dem Quellcode bauen
# Die Server-API ist nur im internen Netz erreichbar; von außen nur Caddy auf 8443 (HTTPS).
#
# Datenbank: SQLite im Volume syncdrive-data, im Serverprozess (gemessen schneller als ein eigener Datenbank-Container; ein Server-Prozess,
# ADR-9). Ein Redis-Cache bringt dabei nichts Messbares (ADR-13). Erst für mehrere Server-Instanzen kämen PostgreSQL und
# ein verteilter Benachrichtiger hinzu.
#
# Sicherung: täglich um SYNCDRIVE_BACKUP_TIME (Zeitzone TZ) nach syncdrive-backup: Datenbank-Stand (die letzten 7), Blöcke inkrementell,
# Anmeldeseite. Am besten auf ein anderes Laufwerk legen, z. B. statt des Volumes:  - /mnt/usb/syncdrive-backup:/backup
# (der Ordner muss für UID 1654 beschreibbar sein: sudo chown 1654 /mnt/usb/syncdrive-backup).
services:
  server:
    image: magpeek/syncdrive-server:${SYNCDRIVE_VERSION:-latest}
    build:
      context: ..
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
      SYNCDRIVE_Server__AdminUserName: admin
      SYNCDRIVE_Server__AdminPasswordFile: /run/secrets/admin_password
      # Der Server hört nur im internen Netz; Caddy terminiert TLS und setzt X-Forwarded-Proto.
      SYNCDRIVE_Server__TrustForwardedHeaders: "true"
      SYNCDRIVE_Server__RequireTls: "true"
      SYNCDRIVE_Server__BackupDirectory: /backup
      SYNCDRIVE_Server__BackupTime: ${SYNCDRIVE_BACKUP_TIME:-02:30}
    secrets:
      - admin_password
    volumes:
      - syncdrive-data:/data
      - syncdrive-backup:/backup
    # Härtung: Dateisystem des Images nur lesbar, keine Zusatzrechte, begrenzte Ressourcen.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2"
          pids: 256
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [internal]

  proxy:
    image: caddy:2
    environment:
      SYNCDRIVE_HOST: ${SYNCDRIVE_HOST:-localhost}
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    depends_on:
      server:
        condition: service_healthy
    networks: [internal, default]

secrets:
  admin_password:
    file: ./admin-password.txt

volumes:
  syncdrive-data:
  syncdrive-backup:
  caddy-data:

networks:
  internal:
    internal: true
