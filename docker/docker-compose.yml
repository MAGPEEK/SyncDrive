# SyncDrive server from the Docker Hub image. Usage: see README.md in this folder.
services:
  syncdrive:
    image: magpeek/syncdrive-server:latest
    container_name: syncdrive
    restart: unless-stopped
    ports:
      - "8080:8080"                                          # host port : container port (the app listens on 8080)
    environment:
      TZ: Europe/Berlin
      SYNCDRIVE_Server__AdminUserName: admin
      SYNCDRIVE_Server__AdminPassword: change-me-to-a-long-password   # read on the first start only
      SYNCDRIVE_Server__RequireTls: "false"                  # plain HTTP; HTTPS: see docs/server.md
    volumes:
      - syncdrive-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

volumes:
  syncdrive-data:
