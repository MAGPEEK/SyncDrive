# Ein Tag vX.Y.Z baut die Windows-Pakete (mit Azure Artifact Signing signiert), das Mac-Disk-Image und das Server-Image (Docker Hub magpeek/syncdrive-server, Tags <version> und latest) und legt ein GitHub-Release an.
name: release
on:
  push:
    tags: ['v*']
env:
  DOCKERHUB_USER: magpeek
permissions:
  contents: write
  id-token: write   # Anmeldung bei Azure per OIDC für Artifact Signing
jobs:
  client:
    runs-on: windows-latest
    # Azure Artifact Signing (docs/development.md): die Umgebung "release" bindet die Azure-Anmeldung an diesen Job. Ohne die
    # Variable ARTIFACT_SIGNING_ACCOUNT bleibt der Client unsigniert.
    environment: release
    env:
      SYNCDRIVE_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
      SYNCDRIVE_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
      SYNCDRIVE_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Build-Nummer = Zahl der Commits
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - if: vars.ARTIFACT_SIGNING_ACCOUNT != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - run: pwsh installer/build-client.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: client
          path: artifacts/client/*

  client-macos:
    # Mac-Client (Apple Silicon) als Disk-Image; bis 1.0 eine Vorschau, ad-hoc signiert (ADR-14)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: bash installer/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: client-macos
          path: artifacts/client/*

  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # Docker Hub: Zugriffstoken (Read & Write) als Repository-Secret DOCKERHUB_TOKEN hinterlegen.
      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: names
        run: |
          echo "image=docker.io/${DOCKERHUB_USER}/syncdrive-server" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.image }}:${{ steps.names.outputs.version }}
            ${{ steps.names.outputs.image }}:latest

  publish:
    needs: [client, client-macos, server-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: client-macos
          path: dist
      - name: Release notes aus dem CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \[" v "\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          printf '\n---\nServer image: `docker pull %s/syncdrive-server:%s`\n' "$DOCKERHUB_USER" "$version" >> notes.md
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "SyncDrive $GITHUB_REF_NAME" --notes-file notes.md --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
